services:
  postgres:
    image: postgres:16-alpine
    container_name: studysync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studysync}
      POSTGRES_DB: ${POSTGRES_DB:-studysync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - studysync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studysync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: studysync-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@studysync.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    volumes:
      - studysync-pgadmin-data:/var/lib/pgadmin

volumes:
  studysync-postgres-data:
  studysync-pgadmin-data:
